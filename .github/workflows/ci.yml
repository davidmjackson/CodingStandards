name: gate
on: [push, pull_request]
jobs:
  dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n hooks/dispatch.sh
      - run: hooks/test-stop-gate.sh
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sample-repos/python-sample/prove-gate.sh
      - run: sample-repos/typescript-sample/prove-gate.sh
